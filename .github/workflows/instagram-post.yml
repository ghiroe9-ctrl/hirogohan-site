name: Instagram post

on:
  push:
    branches: [main]
    paths:
      - "instagram/posts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish approved posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python instagram/post.py
      - name: Record result
        run: |
          git config user.name "hirogohan-bot"
          git config user.email "g.hiro.e9@gmail.com"
          git add instagram/posts
          git diff --cached --quiet || git commit -m "Instagram投稿の記録 [skip ci]"
          git push
